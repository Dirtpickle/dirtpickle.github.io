<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dirtpickle / Links</title>
  <meta name="description" content="Dirtpickle (Mike Peterson), game artist. Art that bites back. Portfolio, Instagram and more.">
  <meta property="og:title" content="Dirtpickle">
  <meta property="og:description" content="Dirtpickle (Mike Peterson), game artist. Art that bites back. Portfolio, Instagram and more.">
  <link rel="canonical" href="https://dirtpickle.com/links.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@600;900&family=Barlow:wght@400&display=swap" rel="stylesheet">
  <style>:root{--bg:#101112;--surf:#171a1d;--surf2:#22272b;--bdr:#3b4248;--txt:#f1f4f6;--dim:#9aa5ad;--acc:#ff7a1a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,color-mix(in srgb,var(--acc) 18%,var(--bg)) 0%,var(--bg) 55%);color:var(--txt);font-family:'Barlow',sans-serif;display:flex;justify-content:center;padding:48px 16px}
  main{width:100%;max-width:480px;text-align:center}
  .avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 16px;background:var(--surf2);border:2px solid var(--acc);display:grid;place-items:center;font:900 40px 'Barlow Condensed',sans-serif;color:var(--acc);overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  h1{margin:0;font:900 40px/1 'Barlow Condensed',sans-serif;letter-spacing:.04em;text-transform:uppercase}
  .tag{margin:8px 0 32px;font:14px 'Share Tech Mono',monospace;color:var(--dim)}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
  a.link{display:block;padding:16px 20px;background:var(--surf);border:1px solid var(--bdr);border-radius:10px;color:var(--txt);text-decoration:none;font:600 20px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;transition:transform .12s,border-color .12s,background .12s}
  a.link small{display:block;margin-top:2px;font:12px 'Share Tech Mono',monospace;letter-spacing:0;text-transform:none;color:var(--dim)}
  a.link:hover,a.link:focus-visible{transform:translateY(-2px);border-color:var(--acc);background:var(--surf2);outline:none}
  a.link.primary{background:var(--acc);border-color:var(--acc);color:var(--bg)}
  a.link.primary small{color:var(--bg);opacity:.7}
  footer{margin-top:36px;font:12px 'Share Tech Mono',monospace;color:var(--dim)}
</style>
</head>
<body>
  <main>
    <div class="avatar">D</div>
    <h1>Dirtpickle</h1>
    <p class="tag">Art that bites back.</p>
    <ul><li><a class="link primary" href="https://dirtpickle.com/" rel="noopener noreferrer">Portfolio<small>dirtpickle.com</small></a></li><li><a class="link" href="https://www.instagram.com/dirt.pickle/" rel="noopener noreferrer">Instagram<small>@dirt.pickle</small></a></li><li><a class="link" href="https://x.com/Dirtpickle" rel="noopener noreferrer">X<small>@Dirtpickle</small></a></li><li><a class="link" href="http://www.fiverr.com/dirtpickle" rel="noopener noreferrer">Hire me on Fiverr<small>fiverr.com/dirtpickle</small></a></li></ul>
    <footer>&copy; 2026 Dirtpickle</footer>
  </main>
</body>
</html>
